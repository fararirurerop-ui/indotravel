<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-box">

    <h2>Register</h2>

    <form id="registerForm">

        <input
            type="text"
            id="username"
            placeholder="Username"
            required>

        <input
            type="email"
            id="email"
            placeholder="Email"
            required>

        <input
            type="password"
            id="password"
            placeholder="Password"
            required>

        <button type="submit">
            Daftar
        </button>

    </form>

    <br>

    <a href="index.html">
        Sudah punya akun? Login
    </a>

</div>

<script src="register.js"></script>

</body>
</html>
